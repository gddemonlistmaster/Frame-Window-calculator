
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MacroPlayer
          path: build/**/*.geode
          
